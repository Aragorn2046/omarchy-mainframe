name: Bug report
description: Something in Mainframe is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead? A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: "1. Open Mainframe\n2. Click ...\n3. ..."
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "CPU, GPU (and driver: xe / i915 / amdgpu / nvidia), laptop or desktop"
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Mainframe release or commit, Omarchy version, Quickshell version (qs --version)"
  - type: textarea
    id: log
    attributes:
      label: Log output (optional)
      description: Run `qs -p mainframe` from your checkout and paste any errors. Remove anything private first.
      render: text
