name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # archlinux:latest, pinned 2026-11-08. Dependabot or a maintainer bumps this digest.
    container: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    timeout-minutes: 20
    steps:
      - name: Install test dependencies
        run: |
          set -o pipefail
          # quickshell runs the app; qt6-declarative provides qmltestrunner.
          # nodejs and python run the tests; procps-ng provides process tools.
          # git checks out the repository; ttf-dejavu supplies offscreen fonts.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman-key --recv-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571 --keyserver hkps://keys.openpgp.org || \
            pacman-key --recv-keys 40DFB630FF42BCFFB047046CF0134EE680CAC571 --keyserver hkps://keyserver.ubuntu.com
          pacman-key --finger 40DFB630FF42BCFFB047046CF0134EE680CAC571
          pacman-key --lsign-key 40DFB630FF42BCFFB047046CF0134EE680CAC571
          sed -i '/^\[core\]/i [omarchy]\nServer = https://pkgs.omarchy.org/stable/$arch\n' /etc/pacman.conf
          pacman -Sy
          pacman -Syu --noconfirm --needed omarchy/quickshell extra/qt6-declarative extra/nodejs core/python core/procps-ng extra/git extra/ttf-dejavu || \
            pacman -Syu --noconfirm --needed omarchy/quickshell extra/qt6-declarative extra/nodejs core/python core/procps-ng extra/git extra/ttf-dejavu
          installed_version=$(pacman -Q quickshell | awk '{print $2}')
          omarchy_version=$(pacman -Si omarchy/quickshell | awk '/^Version[[:space:]]*:/ {print $3}')
          test -n "$installed_version"
          test "$installed_version" = "$omarchy_version"
          useradd -m mainframe-ci
          install -d -m 0700 -o mainframe-ci -g mainframe-ci /tmp/mainframe-ci-runtime
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Give test user ownership of checkout
        run: chown -R mainframe-ci:mainframe-ci "$GITHUB_WORKSPACE"
      - name: JavaScript tests
        run: runuser -u mainframe-ci -- env HOME=/home/mainframe-ci XDG_RUNTIME_DIR=/tmp/mainframe-ci-runtime node --test mainframe/tests/
      - name: Python tests
        run: |
          # Match GitHub's unlimited stack to exercise the explicit JSON depth limit.
          ulimit -s unlimited
          runuser -u mainframe-ci -- env HOME=/home/mainframe-ci XDG_RUNTIME_DIR=/tmp/mainframe-ci-runtime python3 -m unittest discover -s mainframe/tests -p 'test_*.py'
      - name: Collector self-test
        run: runuser -u mainframe-ci -- env HOME=/home/mainframe-ci XDG_RUNTIME_DIR=/tmp/mainframe-ci-runtime python3 mainframe/collect.py --selftest
      - name: QML tests
        run: runuser -u mainframe-ci -- env HOME=/home/mainframe-ci XDG_RUNTIME_DIR=/tmp/mainframe-ci-runtime QT_QPA_PLATFORM=offscreen QSG_RENDER_LOOP=basic /usr/lib/qt6/bin/qmltestrunner -input mainframe/tests
      - name: Headless smoke tests
        # Skip the real SSH failure check and remote connections: CI has no hosts.
        # The live window is not enabled: CI has no Wayland session. No user bus is needed.
        # Skip storage shutdown: the runner has no scannable disk; it runs on real machines.
        # Shared runners are noisy, so report CPU and frame measurements without blocking merges.
        run: runuser -u mainframe-ci -- env HOME=/home/mainframe-ci XDG_RUNTIME_DIR=/tmp/mainframe-ci-runtime MAINFRAME_SMOKE_GATES=report MAINFRAME_SMOKE_NO_SCOPE=1 MAINFRAME_SMOKE_NO_SSH=1 MAINFRAME_SMOKE_NO_REMOTE=1 MAINFRAME_SMOKE_SKIP_STORAGE=1 QT_QPA_PLATFORM=offscreen QSG_RENDER_LOOP=basic scripts/mainframe-smoke.sh
