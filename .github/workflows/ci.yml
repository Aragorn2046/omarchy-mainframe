name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install test dependencies
        run: |
          # quickshell runs the app; qt6-declarative provides qmltestrunner.
          # nodejs and python run the tests; procps-ng provides process tools.
          # git checks out the repository; ttf-dejavu supplies offscreen fonts.
          pacman -Syu --noconfirm --needed quickshell qt6-declarative nodejs python procps-ng git ttf-dejavu
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JavaScript tests
        run: node --test mainframe/tests/
      - name: Python tests
        run: python3 -m unittest discover -s mainframe/tests -p 'test_*.py'
      - name: Collector self-test
        run: python3 mainframe/collect.py --selftest
      - name: QML tests
        run: QT_QPA_PLATFORM=offscreen QSG_RENDER_LOOP=basic /usr/lib/qt6/bin/qmltestrunner -input mainframe/tests
      - name: Headless smoke tests
        # Skip the real SSH failure check and remote connections: CI has no hosts.
        # The live window is not enabled: CI has no Wayland session. No user bus is needed.
        # Shared runners are noisy, so report CPU and frame measurements without blocking merges.
        run: MAINFRAME_SMOKE_GATES=report MAINFRAME_SMOKE_NO_SCOPE=1 MAINFRAME_SMOKE_NO_SSH=1 MAINFRAME_SMOKE_NO_REMOTE=1 QT_QPA_PLATFORM=offscreen QSG_RENDER_LOOP=basic scripts/mainframe-smoke.sh
